# ──────────────────────────────────────────────────────────
# SonarQube Configuration — Trendz Full Stack
# ──────────────────────────────────────────────────────────

# Project identification
sonar.projectKey=trendz-full-stack
sonar.projectName=Trendz Full Stack
sonar.projectVersion=1.0

# Source directories
sonar.sources=backend/,frontend/src/,admin/src/

# Exclusions — skip non-application code
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/*.test.js,\
  **/*.spec.js,\
  **/*.min.js,\
  **/coverage/**,\
  **/.next/**

# Language
sonar.language=js
sonar.sourceEncoding=UTF-8

# Coverage (if you add tests later)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
