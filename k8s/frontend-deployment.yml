# ──────────────────────────────────────────────────────────
# Frontend Deployment — React App served via Nginx
# ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trendz-frontend
  namespace: trendz
  labels:
    app: trendz
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trendz
      component: frontend
  template:
    metadata:
      labels:
        app: trendz
        component: frontend
    spec:
      containers:
        - name: frontend
          image: 133375667688.dkr.ecr.us-east-1.amazonaws.com/trendz-frontend:6
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
      restartPolicy: Always
