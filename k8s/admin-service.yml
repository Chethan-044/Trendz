# ──────────────────────────────────────────────────────────
# Admin Service — Exposes the Admin Panel within the cluster
# ──────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: trendz-admin-service
  namespace: trendz
  labels:
    app: trendz
    component: admin
spec:
  type: ClusterIP
  selector:
    app: trendz
    component: admin
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
