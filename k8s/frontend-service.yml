# ──────────────────────────────────────────────────────────
# Frontend Service — Exposes the React app within the cluster
# ──────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: trendz-frontend-service
  namespace: trendz
  labels:
    app: trendz
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: trendz
    component: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
